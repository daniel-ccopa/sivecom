services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sivecom:sivecom@db:5432/sivecom
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./storage/paddleocr_models:/root/.paddlex/official_models
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sivecom
      POSTGRES_USER: sivecom
      POSTGRES_PASSWORD: sivecom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
